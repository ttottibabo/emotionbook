<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감정책 · 기분으로 찾는 책 블로그</title>
<meta name="description" content="오늘 기분을 한 문장으로 적으면, 그 마음에 맞는 책 이야기를 찾아 드리는 블로그입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="감정책 · 기분으로 찾는 책 블로그">
<meta property="og:description" content="오늘 기분, 한 문장이면 맞는 책 이야기가 나옵니다.">
<meta property="og:url" content="https://ttottibabo.github.io/emotionbook/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site">
  <a class="brand" href="./" id="home">📖 감정책</a>
  <span class="muted">기분으로 찾는 책 블로그</span>
</header>
<main>
  <div id="home-view">
    <section class="mood">
      <h1>오늘 마음에 맞는 글 찾기</h1>
      <p class="lede">요즘 기분을 한 문장으로 적어 주세요. <span id="mode-note">마음을 읽고</span> 블로그 글 중에서 지금 읽기 좋은 책 이야기를 골라 드립니다.</p>
      <form id="f" autocomplete="off">
        <label class="sr" for="q">지금 마음</label>
        <input id="q" placeholder="예: 발표 앞두고 불안해" maxlength="200">
        <button class="go" type="submit" id="go">글 찾기</button>
      </form>
      <p class="examples" id="examples">예시: </p>
      <div class="out" id="out" aria-live="polite"></div>
    </section>

    <section class="all">
      <h2>모든 글</h2>
      <div class="list filters" id="filters" role="group" aria-label="감정으로 거르기"></div>
      <ul class="cards" id="posts"><li class="muted">글을 불러오는 중…</li></ul>
    </section>
  </div>

  <article id="post-view" class="post" hidden></article>

  <footer>
    <p id="privacy">입력한 문장은 저장하지 않습니다. 어떤 감정으로 추천했는지만 익명으로 세어 블로그를 다듬는 데 씁니다.</p>
    <p>힘든 마음이 오래간다면 자살예방 상담전화 109(24시간)에 연락해 보세요.</p>
  </footer>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
