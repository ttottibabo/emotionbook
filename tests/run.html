<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>감정책 테스트</title>
<style>body{font:14px/1.6 "Malgun Gothic",sans-serif;margin:1.5rem;background:#fff;color:#111}.pass{color:#1a7f37}.fail{color:#c0392b;font-weight:bold}.known{color:#9a6700}h1{font-size:1.2rem}</style></head>
<body>
<h1>감정책 블로그 로직 테스트</h1>
<pre id="result">실행 중…</pre>
<script type="module">
import { DICT } from "../js/data.js";
import { SEED_POSTS } from "../js/posts.js";
import { ruleMatch, byEmotion, EMOTIONS, postsFor, catalog, sanitizeRecommend, sanitizeAssist, localAssist } from "../js/recommend.js";
import { summarize, writingStats, demoData } from "../js/admin.js";
import { josa, esc, paragraphs } from "../js/util.js";
import { aiRecommend, aiAssist, _setEndpointForTest } from "../js/ai.js";

const rows = [];
let pass = 0, fail = 0, known = 0;
function check(id, name, ok, detail = "", isKnown = false) {
  if (ok) { pass++; rows.push(`<span class="pass">PASS</span> ${id} ${name}`); }
  else if (isKnown) { known++; rows.push(`<span class="known">KNOWN</span> ${id} ${name} → ${detail}`); }
  else { fail++; rows.push(`<span class="fail">FAIL</span> ${id} ${name} → ${detail}`); }
}
const emo = t => { const r = ruleMatch(t); return r.crisis ? "위기" : r.empty ? "빈칸" : r.hit ? r.hit.key : "없음"; };

// 1. 데이터
check("D1", "감정은 12가지", DICT.length === 12, DICT.length);
check("D2", "감정마다 책 3권, 제목·저자·이유가 모두 있음", DICT.every(d => d.books.length === 3 && d.books.every(b => b.length === 3 && b.every(x => x && x.trim()))));
const allWords = DICT.flatMap(d => d.words);
check("D3", "한 단어가 두 감정에 동시에 들어 있지 않음", new Set(allWords).size === allWords.length);
check("D4", "모든 감정을 이름으로 찾을 수 있음", EMOTIONS.every(k => byEmotion(k)));
check("D5", "기본 글 12편, 감정마다 한 편, id 중복 없음", SEED_POSTS.length === 12 && new Set(SEED_POSTS.map(p => p.emotion)).size === 12 && new Set(SEED_POSTS.map(p => p.id)).size === 12);
check("D6", "기본 글마다 제목·요약·본문·책 3권", SEED_POSTS.every(p => p.title && p.summary && p.body && p.books.length === 3));

// 2. 감정 인식 (규칙)
const cases = [
  ["R1", "발표 앞두고 불안해", "불안"], ["R2", "요즘 너무 지쳤어", "지침"], ["R3", "혼자인 것 같아 쓸쓸해", "외로움"],
  ["R4", "시험 망쳐서 후회돼", "후회"], ["R5", "너무 행복한 하루", "행복"], ["R6", "팀장 때문에 화가 나", "분노"],
  ["R7", "할머니가 보고싶다", "그리움"], ["R8", "친구가 부러워", "열등감"], ["R9", "무서워서 못 하겠어", "두려움"],
  ["R10", "고백 받아서 설레", "설렘"], ["R11", "아무것도 귀찮아", "무기력"], ["R12", "눈물이 나", "슬픔"],
  ["R13", "불 안 해", "불안"], ["R14", "오늘 날씨 맑음", "없음"], ["R15", "   ", "빈칸"],
  ["R16", "죽을 만큼 행복해", "행복"], ["R17", "어제 너무 슬펐어", "슬픔"], ["R18", "진짜 화났어", "분노"],
  ["R19", "하루 종일 멍해", "무기력"], ["R20", "합격해서 기뻤다", "행복"], ["R21", "그 사람이 그리웠어", "그리움"], ["R22", "첫 출근이라 떨렸어", "불안"]
];
cases.forEach(([id, t, want]) => check(id, `“${t}” → ${want}`, emo(t) === want, emo(t)));

// 3. 위기 표현: 추천보다 먼저
[["C1", "죽고 싶어"], ["C2", "자 해 하고 싶다"], ["C3", "불안해서 사라지고 싶어"], ["C4", "다 끝내고 싶다"]]
  .forEach(([id, t]) => check(id, `“${t}” → 위기 안내`, emo(t) === "위기", emo(t)));

// 4. 알려진 한계 (규칙 방식) — AI가 연결되면 AI가 대신 읽는다
check("K1", "“이제 불안하지 않아” → 없음 (부정문)", emo("이제 불안하지 않아") === "없음", emo("이제 불안하지 않아"), true);
check("K2", "“팀장한테 깨졌어” → 분노·슬픔 등 (상황만 말한 문장)", emo("팀장한테 깨졌어") !== "없음", emo("팀장한테 깨졌어"), true);
check("K3", "“시험 망쳐서 엄마한테 미안해” → 후회 (사전에 없는 표현)", emo("시험 망쳐서 엄마한테 미안해") === "후회", emo("시험 망쳐서 엄마한테 미안해"), true);

// 5. 글 고르기
const mine = { id: "x1", title: "내 글", emotion: "불안", summary: "요약", date: "2026-11-25", seed: false };
const all = [mine, ...SEED_POSTS];
const picked = postsFor("불안", all);
check("P1", "같은 감정의 글만, 직접 쓴 글이 기본 글보다 먼저", picked.length === 2 && picked[0].id === "x1" && picked.every(p => p.emotion === "불안"), picked.map(p => p.id).join());
check("P2", "AI에 보내는 목록은 id·제목·감정·요약만", Object.keys(catalog(all)[0]).join() === "id,title,emotion,summary");

// 6. AI 답 검증 (중계 서버가 이상한 답을 줘도 화면이 깨지지 않게)
const ok = sanitizeRecommend({ emotion: "불안", picks: [{ id: "seed-02", why: "이유" }, { id: "없는글", why: "x" }, { id: "seed-02", why: "중복" }, { id: "x1" }, { id: "seed-01" }], message: "괜찮아요" }, all);
check("A1", "없는 글 id와 중복은 버리고 최대 3개", ok.picks.map(x => x.id).join() === "seed-02,x1,seed-01", ok.picks.map(x => x.id).join());
check("A2", "12가지 밖의 감정이면 null → 규칙 방식으로 대신", sanitizeRecommend({ emotion: "배고픔", picks: [] }, all) === null);
check("A3", "형식이 아니면 null", sanitizeRecommend("hello", all) === null && sanitizeRecommend(null, all) === null);
check("A4", "AI가 위기라고 하면 위기 안내", sanitizeRecommend({ crisis: true, emotion: "불안", picks: [] }, all)?.crisis === true);
const as = sanitizeAssist({ title: "t".repeat(99), emotion: "모름", tags: ["#불안", "", "책", 3, "a", "b", "c", "d"], description: "d".repeat(200) });
check("A5", "글쓰기 도우미 답 길이·감정·태그 정리", as.title.length === 60 && as.emotion === "" && as.tags[0] === "불안" && as.tags.length === 6 && as.description.length === 90, JSON.stringify(as).slice(0, 80));
const la = localAssist({ bookTitle: "불안", bookAuthor: "알랭 드 보통", notes: "발표 전날 너무 불안해서 이 책을 다시 꺼냈다.\n\n불안은 사랑받고 싶은 마음에서 온다는 말이 남았다." });
check("A6", "AI 미연결 시 규칙 도우미가 감정·요약·카드를 채움", la.emotion === "불안" && la.summary.startsWith("발표 전날") && la.card.includes("#감정책") && la.body.includes("\n\n"), JSON.stringify(la).slice(0, 80));

// 6-1. AI 호출 (가짜 서버로 브라우저 쪽 흐름 확인. 실제 Claude 호출은 중계 서버 배포 후 확인)
const sent = [];
const realFetch = window.fetch;
let fake = () => new Response(JSON.stringify({ crisis: false, emotion: "분노", picks: [{ id: "seed-04", why: "팀장님 일로 속상하셨군요" }], message: "많이 억울하셨겠어요" }), { status: 200 });
window.fetch = async (url, opt) => { sent.push({ url, opt }); return fake(); };
_setEndpointForTest("https://fake.vercel.app/api/");
const air = await aiRecommend("팀장한테 깨졌어", all);
const body0 = JSON.parse(sent[0].opt.body);
check("AI1", "규칙이 못 읽는 문장도 AI 결과(분노)로 추천", air?.emotion === "분노" && air.picks[0].id === "seed-04", JSON.stringify(air));
check("AI2", "보내는 내용은 문장 + 글 목록(id·제목·감정·요약)뿐, 주소는 /recommend", sent[0].url === "https://fake.vercel.app/api/recommend" && Object.keys(body0).join() === "text,posts" && !sent[0].opt.headers.Authorization);
fake = () => new Response(JSON.stringify({ error: "x" }), { status: 500 });
check("AI3", "서버 오류면 null → 규칙 방식으로 대신", (await aiRecommend("불안해", all)) === null);
fake = () => new Response(JSON.stringify({ title: "제목", summary: "요약", emotion: "불안", tags: ["불안"], description: "설명", card: "카드", body: "본문" }), { status: 200 });
const asr = await aiAssist({ bookTitle: "불안", notes: "메모" }, "TOKEN123");
check("AI4", "관리자 도우미는 로그인 토큰을 붙여 /assist로 보냄", sent.at(-1).url.endsWith("/assist") && sent.at(-1).opt.headers.Authorization === "Bearer TOKEN123" && asr.emotion === "불안");
window.fetch = realFetch;
_setEndpointForTest("");

// 7. 화면 도구
check("T1", "조사: 분노를·불안으로·지침으로·후회로", josa("분노", "을/를") === "를" && josa("불안", "으로/로") === "으로" && josa("지침", "으로/로") === "으로" && josa("후회", "으로/로") === "로");
check("T2", "이스케이프와 문단 나누기", esc(`<a href="x">'`) === "&lt;a href=&quot;x&quot;&gt;&#39;" && paragraphs("a\n\n<b>") === "<p>a</p><p>&lt;b&gt;</p>");

// 8. 운영 지표 집계
const now = Date.UTC(2026, 10, 25, 12);
const ev = [
  { type: "recommend", emotion: "불안", source: "input", method: "ai", sid: "a", ts: now - 1000 },
  { type: "recommend", emotion: "불안", source: "link", method: "rule", sid: "b", ts: now - 2000 },
  { type: "recommend", emotion: "지침", source: "chip", method: "rule", sid: "b", ts: now - 3000 },
  { type: "miss", sid: "c", ts: now - 4000 },
  { type: "crisis", sid: "d", ts: now - 5000 },
  { type: "share", emotion: "불안", sid: "a", ts: now - 6000 },
  { type: "view", post: "seed-02", sid: "a", ts: now - 6000 }, { type: "view", post: "seed-02", sid: "b", ts: now - 6000 }, { type: "view", post: "x1", sid: "b", ts: now - 6000 },
  { type: "recommend", emotion: "행복", source: "input", method: "ai", sid: "e", ts: now - 40 * 86400000 }
];
const fb = [{ emotion: "불안", vote: "up", method: "ai", ts: now - 1000 }, { emotion: "불안", vote: "down", method: "rule", ts: now - 1000 }, { emotion: "지침", vote: "up", method: "rule", ts: now - 1000 }];
const s = summarize(ev, fb, 30, now);
check("S1", "30일 밖 기록은 빠짐 (추천 3건)", s.rec === 3, s.rec);
check("S2", "미인식·위기·공유·조회 건수", s.miss === 1 && s.crisis === 1 && s.shares === 1 && s.views === 3, JSON.stringify([s.miss, s.crisis, s.shares, s.views]));
check("S3", "방문 수는 sid 기준 중복 제거 (4)", s.visitors === 4, s.visitors);
check("S4", "감정별 집계: 불안 2건, 👍1 👎1", (x => x.n === 2 && x.up === 1 && x.down === 1 && x.shares === 1)(s.byEmo.find(e => e.key === "불안")));
check("S5", "경로별 집계: 입력1 · 선택1 · 링크1", s.bySource.map(x => x.n).join() === "1,1,1", s.bySource.map(x => x.n).join());
check("S6", "방식별 집계: AI 1건(👍1/1), 규칙 2건(👍1/2)", JSON.stringify(s.byMethod.map(x => [x.n, x.up, x.votes])) === "[[1,1,1],[2,1,2]]", JSON.stringify(s.byMethod));
check("S7", "많이 본 글: seed-02 2회가 1위", s.topPosts[0].post === "seed-02" && s.topPosts[0].n === 2);
const w = writingStats([{ aiUsed: true, editSeconds: 600, status: "published" }, { aiUsed: true, editSeconds: 400, status: "draft" }, { aiUsed: false, editSeconds: 1500, status: "published" }, ...SEED_POSTS]);
check("S8", "글쓰기 자동화: AI 평균 500초, 직접 1500초, 67% 절약, 기본 글 제외", w.total === 3 && w.ai === 2 && w.avgAi === 500 && w.avgManual === 1500 && Math.round(w.saved * 100) === 67, JSON.stringify(w));
const d1 = demoData(now), d2 = demoData(now);
check("S9", "예시 데이터는 매번 같음", JSON.stringify(d1.events) === JSON.stringify(d2.events) && d1.posts.length === 4);

rows.push("", `합계: 통과 ${pass} · 실패 ${fail} · 알려진 한계 ${known}`);
const el = document.getElementById("result");
el.innerHTML = rows.join("\n");
el.dataset.done = fail === 0 ? "ok" : "fail";
</script>
</body>
</html>
