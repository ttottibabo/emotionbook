<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>감정책 AI 서버 테스트</title>
<style>body{font:14px/1.6 "Malgun Gothic",sans-serif;margin:1.5rem;background:#fff;color:#111}.pass{color:#1a7f37}.fail{color:#c0392b;font-weight:bold}</style>
<script type="importmap">{ "imports": { "@anthropic-ai/sdk": "./stubs/anthropic-sdk.js" } }</script></head>
<body>
<h1 style="font-size:1.2rem">AI 중계 서버 테스트 (server/lib/core.js, Claude는 가짜로 대신)</h1>
<pre id="result">실행 중…</pre>
<script type="module">
import Anthropic from "@anthropic-ai/sdk";
import { handle, allow } from "../server/lib/core.js";

const rows = []; let pass = 0, fail = 0;
const check = (id, name, ok, detail = "") => { ok ? pass++ : fail++; rows.push(`<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${id} ${name}${ok ? "" : " → " + detail}`); };

// Vercel의 req/res를 흉내 낸다
function call(route, { method = "POST", origin = "https://ttottibabo.github.io", body = {}, auth, ip = "1.1.1.1" } = {}, env = { ANTHROPIC_API_KEY: "test" }, deps = {}) {
  const res = { headers: {}, code: 0, data: null,
    setHeader(k, v) { this.headers[k] = v; }, status(c) { this.code = c; return this; },
    json(d) { this.data = d; return this; }, end() { return this; } };
  const req = { method, body, headers: { origin, "x-forwarded-for": ip, ...(auth ? { authorization: auth } : {}) } };
  return handle(route, req, res, env, deps).then(() => res);
}
const posts = [{ id: "seed-04", title: "화가 가라앉지 않을 때", emotion: "분노", summary: "요약" }, { id: "seed-01", title: "슬픈 날", emotion: "슬픔", summary: "요약" }];
let asked = null;
const fakeAsk = answer => opts => { asked = opts; return Promise.resolve(answer); };
const token = uid => "x." + btoa(JSON.stringify({ sub: uid })).replace(/=+$/, "") + ".y";

let r = await call("recommend", { body: { text: "팀장한테 깨졌어", posts } }, undefined, { ask: fakeAsk({ crisis: false, emotion: "분노", picks: [{ id: "seed-04", why: "이유" }, { id: "없는글", why: "x" }], message: "괜찮아요" }) });
check("V1", "추천: 200, 없는 글 id는 버림, CORS 헤더는 블로그 주소", r.code === 200 && r.data.picks.length === 1 && r.headers["Access-Control-Allow-Origin"] === "https://ttottibabo.github.io", JSON.stringify(r.data));
check("V2", "Claude에는 글 목록과 독자 문장을 태그로 감싸서 보냄, 독자용 effort low", asked.user.includes("<reader_text>\n팀장한테 깨졌어") && asked.effort === "low" && asked.schema.properties.emotion.enum.length === 12);
asked = null;
r = await call("recommend", { body: { text: "다 끝내 고 싶 다", posts } }, undefined, { ask: fakeAsk({}) });
check("V3", "위기 표현은 Claude를 부르지 않고 바로 crisis", r.code === 200 && r.data.crisis === true && asked === null);
r = await call("recommend", { origin: "https://evil.example", body: { text: "불안해", posts } });
check("V4", "다른 사이트에서 온 요청은 403", r.code === 403, r.code);
r = await call("recommend", { method: "OPTIONS" });
check("V5", "사전 요청(OPTIONS)은 204", r.code === 204);
r = await call("recommend", { body: { text: "불안해", posts } }, {});
check("V6", "키가 없으면 500과 안내", r.code === 500 && r.data.error.includes("ANTHROPIC_API_KEY"));
r = await call("recommend", { body: { text: "   ", posts } }, undefined, { ask: fakeAsk({}) });
check("V7", "빈 문장은 400", r.code === 400);
r = await call("recommend", { body: { text: "불안해", posts } }, undefined, { ask: () => Promise.reject(new Anthropic.AuthenticationError(401, "bad")) });
check("V8", "키가 틀리면 502 '키가 올바르지 않습니다'", r.code === 502 && r.data.error.includes("키가 올바르지"), JSON.stringify(r.data));
const t0 = 1e12; let okCount = 0; for (let i = 0; i < 11; i++) if (allow("9.9.9.9", t0 + i)) okCount++;
check("V9", "IP당 1분 10회까지만 허용, 1분 뒤 다시 허용", okCount === 10 && allow("9.9.9.9", t0 + 61000));

r = await call("assist", { body: { bookTitle: "월든", notes: "메모" } }, undefined, { ask: fakeAsk({}) });
check("V10", "관리자 도우미: 로그인 토큰 없으면 401", r.code === 401, r.code);
let fsUrl = "";
r = await call("assist", { body: { bookTitle: "월든", notes: "메모" }, auth: "Bearer " + token("notAdmin1") }, undefined, { ask: fakeAsk({}), fetch: url => { fsUrl = url; return Promise.resolve({ ok: false }); } });
check("V11", "관리자 문서가 없으면 403, Firestore admins/{uid}로 확인", r.code === 403 && fsUrl.endsWith("/projects/emotionbook-fcf08/databases/(default)/documents/admins/notAdmin1"), fsUrl);
r = await call("assist", { body: { bookTitle: "월든", notes: "요즘 지쳤다" }, auth: "Bearer " + token("Admin123") }, undefined, { ask: fakeAsk({ title: "t", emotion: "지침" }), fetch: () => Promise.resolve({ ok: true }) });
check("V12", "관리자면 200, 메모를 <memo>로 감싸고 effort medium", r.code === 200 && r.data.emotion === "지침" && asked.user.includes("<memo>\n요즘 지쳤다") && asked.effort === "medium");
r = await call("assist", { body: { bookTitle: "월든", notes: "x" }, auth: "Bearer a.b.c" }, undefined, { ask: fakeAsk({}) });
check("V13", "형식이 잘못된 토큰은 401", r.code === 401);

rows.push("", `합계: 통과 ${pass} · 실패 ${fail}`);
const el = document.getElementById("result"); el.innerHTML = rows.join("\n"); el.dataset.done = fail ? "fail" : "ok";
</script>
</body>
</html>
