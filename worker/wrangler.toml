# 감정책 AI 중계 서버 설정 (Cloudflare Workers)
name = "emotionbook-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 이 사이트에서 온 요청만 받는다 (쉼표로 구분)
ALLOWED_ORIGINS = "https://ttottibabo.github.io,http://localhost:5500,http://127.0.0.1:5500"
# Firebase 프로젝트 ID (js/firebase-config.js의 projectId와 같게)
FIREBASE_PROJECT_ID = ""
# 사용할 Claude 모델. 무료 크레딧을 아끼려면 "claude-haiku-5-5"로 바꾼다.
MODEL = "claude-opus-5-5"

# ANTHROPIC_API_KEY는 여기에 쓰지 않는다. Cloudflare 대시보드의 Secret으로만 넣는다.

# 독자용 /recommend 요청 제한: IP당 1분에 10번
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
